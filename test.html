<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Counter Framework - Test</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        input {
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 70%;
        }
        button {
            background: #000;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-left: 0.5rem;
        }
        ul { list-style: none; padding: 0; }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            border-bottom: 1px solid #eee;
        }
        li span { cursor: pointer; }
        li span.done { text-decoration: line-through; color: #888; }
        .delete {
            background: #d00;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import { h, useState, renderRoot } from "https://esm.sh/gh/schallten/Button-Counter-Framework/core/index.ts";

        function App() {
            const [todos, setTodos] = useState([]);
            const [input, setInput] = useState("");

            const addTodo = () => {
                if (input.trim()) {
                    setTodos([...todos, { text: input, done: false }]);
                    setInput("");
                }
            };

            const toggleTodo = (index) => {
                const newTodos = [...todos];
                newTodos[index].done = !newTodos[index].done;
                setTodos(newTodos);
            };

            const deleteTodo = (index) => {
                setTodos(todos.filter((_, i) => i !== index));
            };

            return h("div", {},
                h("h1", {}, "Todo List"),
                h("div", { style: "margin-bottom: 1rem;" },
                    h("input", {
                        id: "todo-input",
                        value: input,
                        oninput: (e) => { console.log("Input changed:", e.target.value); setInput(e.target.value); },
                        placeholder: "Add a task...",
                        onkeydown: (e) => e.key === "Enter" && addTodo()
                    }),
                    h("button", { onclick: addTodo }, "Add")
                ),
                h("ul", {},
                    todos.length === 0
                        ? h("li", { style: "color: #888; justify-content: center;" }, "No tasks yet")
                        : todos.map((todo, i) =>
                            h("li", { key: i },
                                h("span", {
                                    class: todo.done ? "done" : "",
                                    onclick: () => toggleTodo(i)
                                }, todo.text),
                                h("button", {
                                    class: "delete",
                                    onclick: () => deleteTodo(i)
                                }, "Delete")
                            )
                        )
                ),
                h("p", { style: "color: #666; font-size: 0.9rem;" }, "Total: " + todos.length + " tasks")
            );
        }

        renderRoot(App, document.getElementById("app"));
    </script>
</body>
</html>
